# One-off training Job: fetch -> features -> train -> promote (if MAPE passes the gate),
# writing the model into the SAME PVC the API pods mount at /app/models. The API workers
# notice the new version.txt within ~5 s - no restart needed.
# Re-run:  kubectl -n btc-forecast delete job btc-train --ignore-not-found && kubectl apply -f k8s/train-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: btc-train
  namespace: btc-forecast
  labels:
    app.kubernetes.io/name: btc-train
    app.kubernetes.io/part-of: btc-forecast
spec:
  backoffLimit: 2  # retry a failed run twice (e.g. data source outage)
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400  # keep the finished pod/logs for a day (report screenshots)
  template:
    metadata:
      labels:
        app.kubernetes.io/name: btc-train
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001  # makes the PVC writable for the non-root user
      containers:
        - name: train
          # Training image built and pushed by GitHub Actions (same src/ code as Airflow + KFP)
          image: docker.io/samiurk/btc-forecast-train:48cb72d790da3b2e2bafacc98501aefd5ae660d8
          imagePullPolicy: IfNotPresent
          args: ["all"]  # ENTRYPOINT is `python -m src.cli`
          envFrom:
            - configMapRef:
                name: btc-api-config  # MODEL_STAGE, LOG_LEVEL, MODELS_DIR, MAPE_THRESHOLD
            - secretRef:
                name: btc-api-secret  # COINGECKO_API_KEY (optional)
          env:
            - name: DATA_DIR  # historical data files are kept on the PVC too
              value: /app/models/data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: models
              mountPath: /app/models
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: btc-models-pvc
