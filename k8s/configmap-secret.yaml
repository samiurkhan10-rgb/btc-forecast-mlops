# D1: configuration decoupled from code, injected into the pods as environment variables.
---
# Non-sensitive settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-api-config
  namespace: btc-forecast
  labels:
    app.kubernetes.io/name: btc-api
data:
  MODEL_STAGE: "production"
  LOG_LEVEL: "INFO"
  PORT: "5000"
  MODELS_DIR: "/app/models"
  MAPE_THRESHOLD: "10"
  # Extra gunicorn flags (read natively by gunicorn). keep-alive must be LONGER than
  # ingress-nginx's upstream-keepalive-timeout (60 s): otherwise gunicorn closes an idle
  # connection just as NGINX reuses it -> "connection reset by peer" -> HTTP 502 (load test 3).
  GUNICORN_CMD_ARGS: "--keep-alive 75"
---
# Sensitive values.
# The value committed here is a PLACEHOLDER - real secrets never go into git.
# Apply the real key from your local .env AFTER this file (see k8s/README section in docs):
#   kubectl -n btc-forecast create secret generic btc-api-secret \
#     --from-literal=API_KEY=<value from .env> --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: btc-api-secret
  namespace: btc-forecast
  labels:
    app.kubernetes.io/name: btc-api
type: Opaque
stringData:
  API_KEY: "REPLACE_ME"  # protects POST /reload (X-API-Key header)
  COINGECKO_API_KEY: ""  # optional key for the fallback data source
